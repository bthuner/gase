name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Smoke-run the SDL window (dummy video and audio)
        # An optimised build: the crash this guards against only appeared
        # once the optimiser reused stack memory. Thin LTO keeps it quick.
        env:
          CARGO_PROFILE_RELEASE_LTO: "thin"
        run: |
          cargo build --release -p gase
          scripts/smoke-sdl.sh target/release/gase
      - name: The web shell compiles for WebAssembly
        run: cargo clippy -p gase-web --target wasm32-unknown-unknown
      - name: Headless build without SDL (zero external dependencies)
        run: cargo build -p gase --no-default-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
