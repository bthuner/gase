[package]
name = "gase"
description = "Sega Mega Drive / Genesis emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "gase"
path = "src/main.rs"

[features]
default = ["sdl"]
# The windowed frontend. Without it, gase builds as a dependency-free headless
# runner (useful for CI, test ROMs and benchmarking).
sdl = ["dep:sdl2"]

[dependencies]
gase-core.workspace = true
gase-app.workspace = true
sdl2 = { version = "0.37", optional = true }

[lints]
workspace = true
