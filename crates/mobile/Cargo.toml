[package]
name = "gase-mobile"
description = "The native entry point of the gase Android and iOS apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The phone builds turn this library into what each system loads, with
# `cargo rustc --crate-type …` (see mobile/android/build-native.sh and
# mobile/ios/build-rust.sh):
#
# * Android: a `cdylib`, `libmain.so`, which SDL's Java activity loads and
#   whose `SDL_main` it calls;
# * iOS: a `staticlib`, `libgase_mobile.a`, linked into the app's
#   executable next to SDL2.
#
# Here it stays a plain Rust library, so the workspace builds, lints and
# tests it on any desktop without linking anything.
crate-type = ["rlib"]

[dependencies]
gase.workspace = true
sdl2 = "0.37"

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: exporting `SDL_main` to C and calling two SDL/Objective-C
# functions needs it, in one small module (src/native.rs) that allows it.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
